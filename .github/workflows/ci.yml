name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A weekly run on an idle main catches what no push would: a new Go patch release
  # (setup-go resolves the newest toolchain go.mod allows), a new apt ffmpeg behind the
  # differential gate, and new Go vulnerability database entries.
  schedule:
    - cron: '17 6 * * 1'

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Newer pushes to the same ref supersede in-flight runs. The event name is part of the
# group so a scheduled run never cancels a push run for the same ref, or the reverse.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core suite across operating systems, plus native linux/arm64 since the release ships
  # it. The Go version comes from go.mod. Differential tests that shell out to
  # ffmpeg/ffprobe skip here when the tools are absent; the `differential` job below
  # guarantees them.
  #
  # Windows runs the full suite, not just a compile: the filesystem semantics the write
  # path depends on (rename over an open handle, directory fsync, the read-only attribute,
  # broken-pipe errnos) differ there. The race detector needs cgo, and the windows runners
  # ship mingw-w64 gcc, so CGO_ENABLED is pinned.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # release.yml builds the targets in .github/release-targets with cgo off. The matrix
      # runs four of them natively with cgo on, so this is the one place every release
      # build configuration compiles before a tag is cut. It runs before the tests so a
      # broken build still reports behind an unrelated red test.
      - name: Cross-build release targets
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          while read -r target; do
            echo "building ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done < .github/release-targets
      - name: Test (race)
        run: go test ./... -race
      # The suite must stay green on 32-bit targets; linux/386 is the cheapest one.
      # CGO_ENABLED=0 avoids needing a 32-bit C toolchain, and the race detector
      # does not support 386, so this is the plain suite. Placed after the race run
      # so the primary suite reports first.
      - name: Test (linux/386)
        if: matrix.os == 'ubuntu-latest'
        env:
          GOARCH: "386"
          CGO_ENABLED: 0
        run: go test ./...

  # Checks that do not depend on the OS, run once. gofmt and go mod tidy keep the tree
  # canonical; staticcheck covers what go vet does not (dead code, standard library misuse,
  # the style rules with a correctness bearing). Its version is pinned and bumped by hand
  # alongside the Go version in go.mod.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # Tracked sources outside testdata, the files the go tool itself builds: gofmt given a
      # directory would also walk fixtures and dot-directories.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -- '*.go' | grep -v -e '^testdata/' -e '/testdata/' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      # -diff prints what tidy would change and exits non-zero when that is anything.
      - name: go mod tidy
        run: go mod tidy -diff
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  # Known vulnerabilities in the module graph and the standard library, reported only where
  # the code reaches them. The tool is unpinned: it is a client for a live database, and
  # the newest client reads the newest schema.
  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # With ffmpeg/ffprobe present, the per-format differential tests run and gate the
  # build, so each format's interoperability is enforced as it ships. The tests check
  # for the tools at runtime (exec.LookPath); installing ffmpeg here is what turns
  # them on.
  differential:
    name: differential (ffmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify ffmpeg present
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Test (race, differential suite)
        # A missing binary is a hard failure here, not a skip, so a broken ffmpeg
        # install cannot pass the differential gate.
        env:
          WAXLABEL_REQUIRE_FFMPEG: "1"
        run: go test ./... -race
